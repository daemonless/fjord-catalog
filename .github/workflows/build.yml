name: build-catalog

# Reusable workflow: builds one or more fjord catalogs from a caller repo's
# sources.yaml and publishes them to the caller's GitHub Pages as a static
# JSON "API" (<site>/v1/<source>/catalog.json, manifests/, icons/). The
# daemonless catalog itself is just another caller: daemonless/daemonless,
# catalog/sources.yaml.
#
# Minimal caller (.github/workflows/catalog.yml):
#   on:
#     schedule: [{ cron: "0 */6 * * *" }]
#     workflow_dispatch:
#   permissions: { contents: read, pages: write, id-token: write }
#   jobs:
#     catalog:
#       uses: daemonless/fjord-catalog/.github/workflows/build.yml@main
#       with: { sources: catalog/sources.yaml }   # default: sources.yaml at the root
on:
  workflow_call:
    inputs:
      sources:
        description: path to sources.yaml in the caller repo
        type: string
        default: sources.yaml
      out:
        description: output dir inside the published site (schema version path)
        type: string
        default: v1
      publish:
        description: deploy to the caller's GitHub Pages (false = upload an artifact only)
        type: boolean
        default: true
      builder-ref:
        description: fjord-catalog ref to build with
        type: string
        default: main
      dbuild-ref:
        description: daemonless/dbuild ref that renders the AppJail bundles
        type: string
        default: main
      apps:
        description: comma-separated app ids to limit derivation (smoke builds)
        type: string
        default: all

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: daemonless/fjord-catalog
          ref: ${{ inputs.builder-ref }}
          path: .fjord-catalog

      - uses: actions/setup-go@v5
        with:
          go-version-file: .fjord-catalog/go.mod

      # dbuild renders each app's AppJail bundle (director.yml, Makejail,
      # template.conf, .env) into its manifest. Without it the catalog still
      # builds, silently bundle-less -- so it is checked out explicitly and
      # passed with --dbuild rather than relying on the <repos>/dbuild default.
      - uses: actions/checkout@v4
        with:
          repository: daemonless/dbuild
          ref: ${{ inputs.dbuild-ref }}
          path: .dbuild

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbuild runtime deps
        run: python3 -m pip install --quiet PyYAML jinja2

      - name: Derive catalogs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          (cd .fjord-catalog && go run . \
            --sources "${GITHUB_WORKSPACE}/${{ inputs.sources }}" \
            --repos-dir "${GITHUB_WORKSPACE}/repos" \
            --dbuild "${GITHUB_WORKSPACE}/.dbuild" \
            --out "${GITHUB_WORKSPACE}/site/${{ inputs.out }}" \
            --apps "${{ inputs.apps }}")
          # A bundle-less catalog is a regression, not a warning: fail loudly.
          n=$(grep -l "^  appjail:" "${GITHUB_WORKSPACE}/site/${{ inputs.out }}"/*/manifests/*.yaml | wc -l)
          echo "manifests with an appjail bundle: $n"
          [ "$n" -gt 0 ] || { echo "no appjail bundles rendered -- is dbuild working?"; exit 1; }
          # Caller-provided site extras live next to sources.yaml (or at the
          # repo root): CNAME for a custom domain, static/ for a landing page,
          # icon.svg as the branding icon sources.yaml refers to.
          SRC_DIR="$(dirname "${{ inputs.sources }}")"
          for base in "$SRC_DIR" .; do
            [ -f "$base/CNAME" ] && cp "$base/CNAME" site/ && break
          done
          for base in "$SRC_DIR" .; do
            [ -d "$base/static" ] && cp -R "$base/static/." site/ && break
          done
          for d in site/${{ inputs.out }}/*/; do
            [ -f "${d%/}/icon.svg" ] && continue
            for base in "$SRC_DIR" .; do
              [ -f "$base/icon.svg" ] && cp "$base/icon.svg" "${d%/}/icon.svg" && break
            done
          done
          touch site/.nojekyll
          find site -maxdepth 3 -type d | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
