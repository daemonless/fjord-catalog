name: immich
services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/daemonless/immich-server:${IMMICH_TAG:-latest}
    network_mode: host
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: localhost
      REDIS_HOSTNAME: localhost
      IMMICH_MACHINE_LEARNING_URL: http://localhost:3003
    env_file:
      - .env
    depends_on:
      - redis
      - database
      - immich-machine-learning
    restart: always
  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/daemonless/immich-ml:${IMMICH_ML_TAG:-latest}
    network_mode: host
    environment:
      HF_HOME: /cache/huggingface
      MPLCONFIGDIR: /tmp
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
  redis:
    container_name: immich_redis
    image: ghcr.io/daemonless/redis:latest
    network_mode: host
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - redis-data:/config
    restart: always
  database:
    container_name: immich_postgres
    image: ghcr.io/daemonless/immich-postgres:latest
    network_mode: host
    # FreeBSD requires sysvipc for PostgreSQL shared memory
    annotations:
      org.freebsd.jail.allow.sysvipc: "true"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    restart: always
volumes:
  model-cache:
  redis-data:
x-fjord:
  version: "0.1"
  info:
    id: immich
    name: Immich
    description: High performance self-hosted photo and video management solution.
    category: Photos & Media
    class: stack
    icon: /catalog/icons/immich.svg
    upstream_url: https://github.com/immich-app/immich
    web_url: https://immich.app/
  variables:
    - name: IMMICH_TAG
      type: string
      default: latest
      optional: true
    - name: UPLOAD_LOCATION
      label: Path to store uploaded media
      type: path
      default: /containers/immich/library
    - name: IMMICH_ML_TAG
      label: Machine learning image tag (defaults to 'latest'. Set to 'no-avx' for CPUs without AVX)
      type: string
      default: latest
      optional: true
    - name: DB_PASSWORD
      label: PostgreSQL database password
      type: secret
      default: postgres
    - name: DB_USERNAME
      label: PostgreSQL username
      type: string
      default: postgres
    - name: DB_DATABASE_NAME
      label: PostgreSQL database name
      type: string
      default: immich
    - name: DB_DATA_LOCATION
      label: Path to store database files
      type: path
      default: /containers/immich/postgres
