name: mariadb
services:
  mariadb:
    image: ghcr.io/daemonless/mariadb:latest
    container_name: mariadb
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - "${CONFIG_DATA}:/config"
    ports:
      - "${WEB_PORT}:3306"
    restart: unless-stopped
volumes:
  mariadb-config:
x-fjord:
  version: "0.1"
  info:
    id: mariadb
    name: MariaDB
    description: Drop-in replacement for MySQL built by the original authors — extends core MySQL functionality with alternate storage engines, server optimizations, and patches.
    category: Databases
    class: service
    icon: /catalog/icons/mariadb.svg
    upstream_url: https://github.com/MariaDB/server
    web_url: https://mariadb.org/
    only_for_archs:
      - amd64
      - aarch64
  variables:
    - name: WEB_PORT
      label: MariaDB port
      type: port
      default: "3306"
    - name: CONFIG_DATA
      label: MariaDB configuration and data
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: PUID
      type: string
      default: "1000"
    - name: PGID
      type: string
      default: "1000"
    - name: TZ
      type: string
      default: Etc/UTC
    - name: MYSQL_ROOT_PASSWORD
      label: Root password (required on first run)
      type: secret
      default: changeme
    - name: MYSQL_DATABASE
      label: Database to create on first run
      type: string
      default: mydb
    - name: MYSQL_USER
      label: User to create on first run
      type: string
      default: myuser
    - name: MYSQL_PASSWORD
      label: Password for MYSQL_USER
      type: secret
      default: mypassword
  variants:
    - id: 10.11-pkg-latest
      label: 10.11-pkg-latest
    - id: 11.4-pkg-latest
      label: 11.4-pkg-latest
    - id: 11.8-pkg-latest
      label: 11.8-pkg-latest
    - id: 12.3-pkg-latest
      label: 12.3-pkg-latest
      default: true
