name: vaultwarden
services:
  vaultwarden:
    image: ghcr.io/daemonless/vaultwarden:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - SIGNUPS_ALLOWED=${SIGNUPS_ALLOWED}
    volumes:
      - "${CONFIG_DATA}:/config"
    ports:
      - "${WEB_PORT}:80"
x-fjord:
  version: "0.1"
  info:
    id: vaultwarden
    name: Vaultwarden
    description: Lightweight Bitwarden-compatible password manager server — self-host your passwords, secrets, and secure notes.
    category: Utilities
    class: service
    icon: /catalog/icons/vaultwarden.svg
    web_port: ${WEB_PORT}
    upstream_url: https://github.com/dani-garcia/vaultwarden
    web_url: https://github.com/dani-garcia/vaultwarden
  variables:
    - name: WEB_PORT
      label: Web UI
      type: port
      default: "80"
    - name: CONFIG_DATA
      label: Data directory (database, attachments, icons)
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
    - name: SIGNUPS_ALLOWED
      label: Enable/disable user registration (true/false)
      type: string
      default: "true"
  variants:
    - id: latest
      label: Upstream binary
    - id: pkg
      label: FreeBSD quarterly packages
      default: true
    - id: pkg-latest
      label: FreeBSD latest packages
