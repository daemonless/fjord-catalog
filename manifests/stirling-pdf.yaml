name: stirling-pdf
services:
  stirling-pdf:
    image: ghcr.io/daemonless/stirling-pdf:latest
    container_name: stirling-pdf
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - "${CONFIG_DATA}:/config"
    ports:
      - "${WEB_PORT}:8080"
x-fjord:
  version: "0.1"
  info:
    id: stirling-pdf
    name: Stirling-PDF
    description: Locally hosted web application for performing various operations on PDF files — merge, split, compress, convert, OCR, and more.
    category: Utilities
    class: service
    icon: /catalog/icons/stirling-pdf.svg
    web_port: ${WEB_PORT}
    upstream_url: https://github.com/Stirling-Tools/Stirling-PDF
    web_url: https://www.stirlingpdf.com/
  variables:
    - name: WEB_PORT
      label: Web UI
      type: port
      default: "8080"
    - name: CONFIG_DATA
      label: Configuration directory
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
  variants:
    - id: latest
      label: Upstream binary
      default: true
    - id: pkg
      label: FreeBSD quarterly packages
    - id: pkg-latest
      label: FreeBSD latest packages
