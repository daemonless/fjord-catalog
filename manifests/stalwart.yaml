name: stalwart
services:
  stalwart:
    image: ghcr.io/daemonless/stalwart:latest
    container_name: stalwart
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - ADMIN_SECRET=${ADMIN_SECRET}
      - ENABLE_V4PROXY=${ENABLE_V4PROXY}
    volumes:
      - "${CONFIG_DATA}:/config"
    # First run: retrieve the temporary admin password from the logs, then open
    # http://<host>:8080/admin to complete the setup wizard.
    ports:
      - "${PORT_25}:25"
      - "${PORT_465}:465"
      - "${PORT_587}:587"
      - "${PORT_143}:143"
      - "${PORT_993}:993"
      - "${PORT_110}:110"
      - "${PORT_995}:995"
      - "${PORT_4190}:4190"
      - "${PORT_443}:443"
      - "${WEB_PORT}:8080"
x-fjord:
  version: "0.1"
  info:
    id: stalwart
    name: Stalwart
    description: Stalwart Mail Server is an open-source mail server solution with JMAP, IMAP4, POP3, and SMTP support and a wide range of modern features. It is written in Rust and designed to be secure, fast, robust and scalable.
    category: Network
    class: service
    icon: /catalog/icons/stalwart.svg
    web_port: ${WEB_PORT}
    upstream_url: https://stalw.art/
    web_url: https://stalw.art/
  variables:
    - name: PORT_25
      label: SMTP
      type: port
      default: "25"
    - name: PORT_465
      label: SMTP submission (implicit TLS)
      type: port
      default: "465"
    - name: PORT_587
      label: SMTP submission (STARTTLS)
      type: port
      default: "587"
    - name: PORT_143
      label: IMAP4
      type: port
      default: "143"
    - name: PORT_993
      label: IMAP4 (implicit TLS)
      type: port
      default: "993"
    - name: PORT_110
      label: POP3
      type: port
      default: "110"
    - name: PORT_995
      label: POP3 (implicit TLS)
      type: port
      default: "995"
    - name: PORT_4190
      label: ManageSieve
      type: port
      default: "4190"
    - name: PORT_443
      label: HTTPS / JMAP / web admin
      type: port
      default: "443"
    - name: WEB_PORT
      label: HTTP / JMAP / web admin
      type: port
      default: "8080"
    - name: CONFIG_DATA
      label: Config (config.toml) + rocksdb data store
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
    - name: ADMIN_SECRET
      label: Password for the fallback 'admin' web-admin account
      type: secret
      default: changeme
    - name: ENABLE_V4PROXY
      label: Enable internal socat IPv4->IPv6 proxy on port 8080 for initial setup UI and healthchecks on FreeBSD (default true). Set false to disable.
      type: string
      default: "true"
  variants:
    - id: latest
      label: Upstream binary
      default: true
    - id: pkg
      label: FreeBSD quarterly packages
    - id: pkg-latest
      label: FreeBSD latest packages
