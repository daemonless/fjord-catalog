name: transmission-wireguard
services:
  transmission-wireguard:
    image: ghcr.io/daemonless/transmission-wireguard:latest
    container_name: transmission-wireguard
    restart: unless-stopped
    annotations:
      org.freebsd.jail.vnet: "new"
    environment:
      - WG_PRIVATE_KEY=${WG_PRIVATE_KEY}
      - WG_PEER_PUBLIC_KEY=${WG_PEER_PUBLIC_KEY}
      - WG_ENDPOINT=${WG_ENDPOINT}
      - WG_ADDRESS=${WG_ADDRESS}
      - WG_DNS=${WG_DNS}
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - "${CONFIG_DATA}:/config"
      - "${DOWNLOADS_PATH}:/downloads"
      - "${WATCH_PATH}:/watch"
    ports:
      - "${WEB_PORT}:9091"
      - "${PORT_51413}:51413"
      - "${PORT_51413_UDP}:51413/udp"
x-fjord:
  version: "0.1"
  info:
    id: transmission-wireguard
    name: Transmission with WireGuard
    description: Transmission BitTorrent client with built-in WireGuard VPN support.
    category: Downloaders
    class: service
    icon: /catalog/icons/transmission-wireguard.svg
    upstream_url: https://github.com/transmission/transmission
    web_url: https://transmissionbt.com/
  variables:
    - name: WEB_PORT
      label: Web UI
      type: port
      default: "9091"
    - name: PORT_51413
      label: Torrent traffic (TCP/UDP)
      type: port
      default: "51413"
    - name: PORT_51413_UDP
      label: Torrent traffic (TCP/UDP)
      type: port
      default: "51413"
    - name: CONFIG_DATA
      label: Configuration directory (settings.json, WireGuard configs)
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: DOWNLOADS_PATH
      label: Download directory
      type: path
      default: ""
    - name: WATCH_PATH
      label: Watch directory for torrent files
      type: path
      default: ""
    - name: WG_PRIVATE_KEY
      label: Your WireGuard private key
      type: secret
      default: your-private-key
    - name: WG_PEER_PUBLIC_KEY
      label: VPN server's public key
      type: secret
      default: vpn-server-public-key
    - name: WG_ENDPOINT
      label: VPN server address (host:port)
      type: string
      default: vpn.example.com:51820
    - name: WG_ADDRESS
      label: 'Your tunnel IP address (default: 10.5.0.2/32)'
      type: string
      default: 10.5.0.2/32
    - name: WG_DNS
      label: 'DNS server to use (default: 1.1.1.1)'
      type: string
      default: 1.1.1.1
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
  variants:
    - id: pkg
      label: FreeBSD quarterly packages
      default: true
    - id: pkg-latest
      label: FreeBSD latest packages
