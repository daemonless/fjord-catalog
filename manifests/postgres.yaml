name: postgres
services:
  postgres:
    image: ghcr.io/daemonless/postgres:latest
    container_name: postgres
    restart: unless-stopped
    # Needs SysV IPC
    annotations:
      org.freebsd.jail.allow.sysvipc: "true"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - "${DATA_PATH}:/var/lib/postgresql/data"
    ports:
      - "${WEB_PORT}:5432"
x-fjord:
  version: "0.1"
  info:
    id: postgres
    name: PostgreSQL
    description: The World's Most Advanced Open Source Relational Database on FreeBSD.
    category: Databases
    class: service
    icon: /catalog/icons/postgres.svg
    upstream_url: https://www.postgresql.org/
    web_url: https://www.postgresql.org/
    only_for_archs:
      - amd64
      - aarch64
  variables:
    - name: WEB_PORT
      label: PostgreSQL port
      type: port
      default: "5432"
    - name: DATA_PATH
      label: Database data directory
      type: path
      default: ""
    - name: POSTGRES_USER
      label: 'Database superuser name (default: postgres)'
      type: string
      default: postgres
    - name: POSTGRES_PASSWORD
      label: Database superuser password
      type: secret
      default: postgres
    - name: POSTGRES_DB
      label: 'Default database to create (default: same as user)'
      type: string
      default: postgres
    - name: PUID
      type: string
      default: "1000"
    - name: PGID
      type: string
      default: "1000"
    - name: TZ
      type: string
      default: UTC
  variants:
    - id: "14"
      label: "14"
    - id: 14-pkg-latest
      label: 14-pkg-latest
    - id: "15"
      label: "15"
    - id: 15-pkg-latest
      label: 15-pkg-latest
    - id: "16"
      label: "16"
    - id: 16-pkg-latest
      label: 16-pkg-latest
    - id: "17"
      label: "17"
    - id: 17-pkg-latest
      label: 17-pkg-latest
    - id: "18"
      label: "18"
      default: true
    - id: 18-pkg-latest
      label: 18-pkg-latest
