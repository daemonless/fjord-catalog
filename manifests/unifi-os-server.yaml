name: unifi-os-server
services:
  unifi-os-server:
    image: ghcr.io/daemonless/unifi-os-server:latest
    container_name: unifi-os-server
    restart: unless-stopped
    network_mode: host # required for UniFi L2 device discovery/adoption broadcast
    annotations:
      org.freebsd.jail.allow.mlock: "true"
      org.freebsd.jail.allow.sysvipc: "true"
    volumes:
      - "${DATA_PATH}:/data"
      - "${DATA_PATH}:/compat/linux/data" # required — see unifios.md
x-fjord:
  version: "0.1"
  info:
    id: unifi-os-server
    name: UniFi OS Server
    description: Ubiquiti UniFi OS Server on FreeBSD — runs the full UniFi management stack (unifi-core, UniFi Network) using FreeBSD jails and linuxulator.
    category: Network
    class: service
    icon: https://api.iconify.design/simple-icons:ubiquiti.svg?color=%23cbd5e1
    upstream_url: https://ui.com/consoles/unifi-os-server
    web_url: https://ui.com/
  variables:
    - name: DATA_PATH
      label: Persistent data (database, config, certs)
      type: path
      default: ""
    - name: DATA_PATH
      type: path
      default: ""
  variants:
    - id: latest
      label: Upstream binary
      default: true
