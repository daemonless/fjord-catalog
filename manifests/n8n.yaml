name: n8n
services:
  n8n:
    image: ghcr.io/daemonless/n8n:latest
    container_name: n8n
    restart: unless-stopped
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      # Set to false if accessing over HTTP without TLS
      #- N8N_SECURE_COOKIE=true
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - "${CONFIG_DATA}:/config"
    ports:
      - "${WEB_PORT}:5678"
x-fjord:
  version: "0.1"
  info:
    id: n8n
    name: n8n
    description: Fair-code workflow automation platform with native AI capabilities — combine visual building with custom code and 400+ integrations.
    category: Utilities
    class: service
    icon: /catalog/icons/n8n.svg
    web_port: ${WEB_PORT}
    upstream_url: https://github.com/n8n-io/n8n
    web_url: https://n8n.io/
  variables:
    - name: WEB_PORT
      label: Web UI
      type: port
      default: "5678"
    - name: CONFIG_DATA
      label: Configuration directory (database, workflows)
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: N8N_ENCRYPTION_KEY
      label: Encryption key for credentials (keep safe!)
      type: secret
      default: your-encryption-key-here
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
  variants:
    - id: latest
      label: Upstream binary
      default: true
