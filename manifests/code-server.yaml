name: code-server
services:
  code-server:
    image: ghcr.io/daemonless/code-server:latest
    container_name: code-server
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - "${CONFIG_DATA}:/config"
    ports:
      - "${WEB_PORT}:8080"
x-fjord:
  version: "0.1"
  info:
    id: code-server
    name: code-server
    description: VS Code in the browser — run a full development environment on your FreeBSD server and access it from anywhere.
    category: Development
    class: service
    icon: /catalog/icons/code-server.png
    web_port: ${WEB_PORT}
    upstream_url: https://github.com/coder/code-server
    web_url: https://coder.com/docs/code-server
    only_for_archs:
      - amd64
  variables:
    - name: WEB_PORT
      label: Web UI
      type: port
      default: "8080"
    - name: CONFIG_DATA
      label: Configuration directory
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
  variants:
    - id: latest
      label: Upstream binary
      default: true
