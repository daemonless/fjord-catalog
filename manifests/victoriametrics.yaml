name: victoriametrics
services:
  victoriametrics:
    image: ghcr.io/daemonless/victoriametrics:latest
    container_name: victoriametrics
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - RETENTION_PERIOD=${RETENTION_PERIOD}
    volumes:
      - "${STORAGE_PATH}:/storage"
      - "${CONFIG_DATA}:/config"
    ports:
      - "${WEB_PORT}:8428"
x-fjord:
  version: "0.1"
  info:
    id: victoriametrics
    name: VictoriaMetrics
    description: VictoriaMetrics is a fast, cost-effective, and scalable open-source time-series database and monitoring solution. It functions as a drop-in replacement for Prometheus with ultra-low memory usage.
    category: Infrastructure & Monitoring
    class: service
    icon: https://api.iconify.design/mdi:chart-timeline-variant.svg?color=%23cbd5e1
    upstream_url: https://github.com/VictoriaMetrics/VictoriaMetrics
    web_url: https://victoriametrics.com/
  variables:
    - name: WEB_PORT
      label: PromQL API, Metrics Ingestion, and Web UI
      type: port
      default: "8428"
    - name: STORAGE_PATH
      label: Time-series database data directory
      type: path
      default: ""
    - name: CONFIG_DATA
      label: Configuration and scrape rules directory
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
    - name: RETENTION_PERIOD
      label: 'Metrics retention period (e.g. 1m, 6m, 1y, default: 1y)'
      type: string
      default: 1y
  variants:
    - id: latest
      label: Upstream binary
      default: true
