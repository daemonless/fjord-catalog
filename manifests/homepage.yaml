name: homepage
services:
  homepage:
    image: ghcr.io/daemonless/homepage:latest
    container_name: homepage
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - "${CONFIG_DATA}:/config"
    ports:
      - "${WEB_PORT}:3000"
x-fjord:
  version: "0.1"
  info:
    id: homepage
    name: Homepage
    description: Modern, fully static, fast, secure and highly customizable application dashboard with integrations for over 100 services.
    category: Utilities
    class: service
    icon: /catalog/icons/homepage.png
    web_port: ${WEB_PORT}
    upstream_url: https://github.com/gethomepage/homepage
    web_url: https://gethomepage.dev/
  variables:
    - name: WEB_PORT
      label: Web UI
      type: port
      default: "3000"
    - name: CONFIG_DATA
      label: Configuration directory (settings, bookmarks, services)
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
  variants:
    - id: latest
      label: Upstream binary
      default: true
    - id: pkg
      label: FreeBSD quarterly packages
    - id: pkg-latest
      label: FreeBSD latest packages
