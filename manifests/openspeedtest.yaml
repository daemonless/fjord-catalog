name: openspeedtest
services:
  openspeedtest:
    image: ghcr.io/daemonless/openspeedtest:latest
    container_name: openspeedtest
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "${WEB_PORT}:3000"
x-fjord:
  version: "0.1"
  info:
    id: openspeedtest
    name: OpenSpeedTest
    description: Self-hosted HTML5 Network Speed Test on FreeBSD.
    category: Utilities
    class: service
    icon: /catalog/icons/openspeedtest.svg
    web_port: ${WEB_PORT}
    upstream_url: https://github.com/openspeedtest/Speed-Test
    web_url: https://openspeedtest.com/
  variables:
    - name: WEB_PORT
      label: Web UI
      type: port
      default: "3000"
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
  variants:
    - id: latest
      label: Upstream binary
      default: true
