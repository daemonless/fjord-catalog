name: smokeping
services:
  smokeping:
    image: ghcr.io/daemonless/smokeping:latest
    container_name: smokeping
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - "${CONFIG_DATA}:/config"
      - "${DATA_PATH}:/data"
    ports:
      - "${WEB_PORT}:80"
x-fjord:
  version: "0.1"
  info:
    id: smokeping
    name: SmokePing
    description: Network latency monitor with historical graphing — tracks round-trip times and packet loss to your hosts over time.
    category: Utilities
    class: service
    icon: /catalog/icons/smokeping.png
    web_port: ${WEB_PORT}
    upstream_url: https://github.com/oetiker/smokeping
    web_url: https://oss.oetiker.ch/smokeping/
    only_for_archs:
      - amd64
      - aarch64
  variables:
    - name: WEB_PORT
      label: Web UI
      type: port
      default: "80"
    - name: CONFIG_DATA
      label: Configuration directory (Probes, Targets, etc.)
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: DATA_PATH
      label: Data directory (RRD database files)
      type: path
      default: ""
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
  variants:
    - id: pkg
      label: FreeBSD quarterly packages
    - id: pkg-latest
      label: FreeBSD latest packages
      default: true
