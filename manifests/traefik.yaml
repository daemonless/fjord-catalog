name: traefik
services:
  traefik:
    image: ghcr.io/daemonless/traefik:latest
    container_name: traefik
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - "${CONFIG_DATA}:/config"
    ports:
      - "${PORT_80}:80"
      - "${PORT_443}:443"
      - "${WEB_PORT}:8080"
x-fjord:
  version: "0.1"
  info:
    id: traefik
    name: Traefik
    description: Modern HTTP reverse proxy and load balancer on FreeBSD.
    category: Infrastructure
    class: service
    icon: /catalog/icons/traefik.svg
    upstream_url: https://github.com/traefik/traefik
    web_url: https://traefik.io/
  variables:
    - name: PORT_80
      label: HTTP
      type: port
      default: "80"
    - name: PORT_443
      label: HTTPS
      type: port
      default: "443"
    - name: WEB_PORT
      label: Dashboard/API
      type: port
      default: "8080"
    - name: CONFIG_DATA
      label: Configuration directory (traefik.yml, dynamic/, letsencrypt/)
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
  variants:
    - id: latest
      label: Upstream binary
      default: true
    - id: pkg
      label: FreeBSD quarterly packages
    - id: pkg-latest
      label: FreeBSD latest packages
    - id: k8s
      label: Passthrough
